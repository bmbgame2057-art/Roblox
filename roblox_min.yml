# Minimal Roblox globals for selene when the full API dump cannot be downloaded.
# Full API/type checking is done by luau-lsp with the official Roblox definitions.
base: luau
name: roblox_min
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  shared: { any: true }
  Instance: { any: true }
  Vector2: { any: true }
  Vector3: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  NumberRange: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Rect: { any: true }
  Ray: { any: true }
  RaycastParams: { any: true }
  TweenInfo: { any: true }
  Random: { any: true }
  Font: { any: true }
  Enum: { any: true }
  BrickColor: { any: true }
  Region3: { any: true }
  task: { any: true }
  typeof: { any: true }
  tick: { any: true }
  time: { any: true }
  warn: { any: true }
  delay: { any: true }
  spawn: { any: true }
  wait: { any: true }
